<svg width="680" viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Retângulo único -->
  <rect x="40" y="42" width="600" height="60" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Divisórias verticais -->
  <line x1="140" y1="42" x2="140" y2="102" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="240" y1="42" x2="240" y2="102" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="340" y1="42" x2="340" y2="102" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="440" y1="42" x2="440" y2="102" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="540" y1="42" x2="540" y2="102" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Textos dentro das células -->
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="90"  y="72" text-anchor="middle" dominant-baseline="central">Matrix 0</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="190" y="72" text-anchor="middle" dominant-baseline="central">Matrix 1</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="290" y="72" text-anchor="middle" dominant-baseline="central">Matrix 2</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="390" y="72" text-anchor="middle" dominant-baseline="central">Matrix 3</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="490" y="72" text-anchor="middle" dominant-baseline="central">Matrix 4</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="590" y="72" text-anchor="middle" dominant-baseline="central">Matrix 5</text>

  <!-- Índices abaixo -->
  <text font-family="sans-serif" font-size="12" fill="#aaaaaa" x="90"  y="118" text-anchor="middle">0</text>
  <text font-family="sans-serif" font-size="12" fill="#aaaaaa" x="190" y="118" text-anchor="middle">1</text>
  <text font-family="sans-serif" font-size="12" fill="#aaaaaa" x="290" y="118" text-anchor="middle">2</text>
  <text font-family="sans-serif" font-size="12" fill="#aaaaaa" x="390" y="118" text-anchor="middle">3</text>
  <text font-family="sans-serif" font-size="12" fill="#aaaaaa" x="490" y="118" text-anchor="middle">4</text>
  <text font-family="sans-serif" font-size="12" fill="#aaaaaa" x="590" y="118" text-anchor="middle">5</text>

